services:
  # ── FastAPI 后端 ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-hub-backend
    env_file: .env
    volumes:
      - backend-data:/app/backend/data
    restart: unless-stopped
    networks:
      - ai-hub-net

  # ── Nuxt 4 前端 (SSR) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-hub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ai-hub-net

  # ── Nginx 反向代理 ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-hub-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - ai-hub-net

volumes:
  backend-data:

networks:
  ai-hub-net:
    driver: bridge
